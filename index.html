        a {

        body {

/* -------------------- LAYOUT -------------------- */

<script>

(() => {
    "use strict";

    const MATCH_CONFIG = [
        { id: "2010280", league: "TCMAC", totalNeeded: 50 },
        { id: "2010098", league: "PCL",   totalNeeded: 10 },
        { id: "2013034", league: "TCMAC", totalNeeded: 7 },
        { id: "2013032", league: "TCMAC", totalNeeded: 25  }
    ];

    const CLUB_SLUG = "the-vortex-order";
    const REFRESH_INTERVAL_MS = 5 * 60 * 1000;

    function setStatusColour(element, status) {
        if (!element) return;
        element.classList.remove("status-green", "status-gold", "status-red");
        element.classList.add(`status-${status}`);
    }

    function isOurClub(team) {
        const id = String(team?.["@id"] || team?.url || "").toLowerCase();
        const name = String(team?.name || "").toLowerCase();
        return id.includes(`/club/${CLUB_SLUG}`) ||
               id.endsWith(`/${CLUB_SLUG}`) ||
               name === "the vortex order";
    }

    async function fetchJson(url) {
        const response = await fetch(url, {
            headers: { "Accept": "application/json" },
            cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    async function fetchOpponentAvatar(clubApiUrl) {
        if (!clubApiUrl) return null;
        try {
            const clubData = await fetchJson(clubApiUrl);
            return clubData.icon || clubData.avatar || null;
        } catch {
            return null;
        }
    }

    function formatTimeSeconds(seconds) {
        if (!seconds) return "3 d/m";
        const days = Math.round(seconds / 86400);
        return days > 0 ? `${days} d/m` : `${Math.round(seconds / 3600)} h/m`;
    }

    function formatRatingStats(settings) {
        if (!settings) return "Open";
        if (settings.min_rating && settings.max_rating) {
            return `${settings.min_rating}-${settings.max_rating}`;
        }
        if (settings.max_rating) return `U${settings.max_rating}`;
        if (settings.min_rating) return `+${settings.min_rating}`;
        return "Open";
    }

    function formatVariant(variant) {
        if (!variant || variant === "standard") return "Standard";
        if (variant === "chess960") return "Chess960";
        return variant.charAt(0).toUpperCase() + variant.slice(1);
    }

    async function processMatchCard(cardAnchor, config) {
        if (!cardAnchor || !config) return;

        const matchId = config.id;
        const leagueName = config.league;
        const totalNeeded = config.totalNeeded || 0;

        cardAnchor.href = `https://www.chess.com/club/matches/${matchId}`;
        cardAnchor.dataset.matchId = matchId;
        cardAnchor.dataset.league = leagueName;
        cardAnchor.dataset.totalNeeded = totalNeeded;

        const avatarImg = cardAnchor.querySelector(".card-avatar");
        const titleEl = cardAnchor.querySelector(".card-title");
        const statsEl = cardAnchor.querySelector(".card-stats");
        const leagueEl = cardAnchor.querySelector(".card-league");
        const dateEl = cardAnchor.querySelector(".card-date");
        const neededEl = cardAnchor.querySelector(".card-needed");

        if (leagueEl) leagueEl.textContent = leagueName;

        const endpoints = [
            `https://api.chess.com/pub/match/${matchId}`,
            `https://api.chess.com/pub/match/live/${matchId}`
        ];

        let matchData = null;
        for (const endpoint of endpoints) {
            try {
                matchData = await fetchJson(endpoint);
                if (matchData) break;
            } catch (e) {
            }
        }

        if (!matchData) {
            if (titleEl) titleEl.textContent = "Error Loading";
            return;
        }

        const teams = Object.values(matchData.teams || {});
        const ourTeam = teams.find(isOurClub);
        const oppTeam = teams.find(t => !isOurClub(t));

        if (oppTeam) {
            if (titleEl) titleEl.textContent = oppTeam.name || "Opponent";
            const avatarUrl = await fetchOpponentAvatar(oppTeam["@id"]);
            if (avatarUrl && avatarImg) avatarImg.src = avatarUrl;
        }

        const timeControl = formatTimeSeconds(matchData.settings?.time_class_per_move);
        const ratingRange = formatRatingStats(matchData.settings);
        const variant = formatVariant(matchData.settings?.rules);
        if (statsEl) statsEl.textContent = `${timeControl} ⋅ ${ratingRange} ⋅ ${variant}`;

        const startTime = matchData.start_time || matchData.start_date;
        if (startTime && dateEl) {
            const startDate = new Date(startTime * 1000);
            const isoDate = startDate.toISOString().split("T")[0];
            const monthStr = startDate.toLocaleString("en-US", { month: "short" }).toUpperCase();
            const dayStr = String(startDate.getDate()).padStart(2, "0");

            dateEl.textContent = `${monthStr} ${dayStr}`;
            dateEl.dataset.date = isoDate;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const daysLeft = Math.round((startDate - today) / 86400000);

            if (daysLeft >= 5) setStatusColour(dateEl, "green");
            else if (daysLeft >= 3) setStatusColour(dateEl, "gold");
            else setStatusColour(dateEl, "red");
        }

        if (ourTeam && neededEl) {
            const currentPlayers = Array.isArray(ourTeam.players) ? ourTeam.players.length : 0;
            const needed = Math.max(0, totalNeeded - currentPlayers);

            neededEl.textContent = `NEEDS ${needed}`;
            neededEl.dataset.currentNeeded = String(needed);

            if (needed === 0) setStatusColour(neededEl, "green");
            else if (needed < 10) setStatusColour(neededEl, "gold");
            else setStatusColour(neededEl, "red");

            neededEl.title = `${currentPlayers} of ${totalNeeded} players registered`;
        }
    }

    function sortMatchCards() {
        const container = document.querySelector(".daily-cards");
        if (!container) return;

        const links = Array.from(container.querySelectorAll(":scope > a"));

        links.sort((a, b) => {
            const dateA = a.querySelector("[data-date]");
            const dateB = b.querySelector("[data-date]");
            const dateValueA = dateA?.dataset.date || "9999-12-31";
            const dateValueB = dateB?.dataset.date || "9999-12-31";

            const dateComparison = dateValueA.localeCompare(dateValueB);
            if (dateComparison !== 0) return dateComparison;

            const neededA = Number(
                a.querySelector(".card-needed")?.dataset.currentNeeded ?? Number.POSITIVE_INFINITY
            );
            const neededB = Number(
                b.querySelector(".card-needed")?.dataset.currentNeeded ?? Number.POSITIVE_INFINITY
            );
            return neededA - neededB;
        });

        links.forEach(link => container.appendChild(link));
    }

    async function refreshAllMatches() {
        const cardElements = Array.from(document.querySelectorAll(".daily-cards > a"));
        const updatePromises = MATCH_CONFIG.map((config, index) => {
            return processMatchCard(cardElements[index], config);
        });
        await Promise.all(updatePromises);
        sortMatchCards();
    }

    refreshAllMatches();
    setInterval(refreshAllMatches, REFRESH_INTERVAL_MS);

    function updateArenaCountdowns() {
        const now = Date.now();
        const DAY = 24 * 60 * 60 * 1000;

        document.querySelectorAll(".arena-card-time[data-target]").forEach(timer => {
            const target = new Date(timer.dataset.target).getTime();

            if (Number.isNaN(target)) {
                timer.textContent = "Invalid date";
                return;
            }

            let remaining = target - now;

            if (remaining <= 0) {
                remaining = DAY - ((now - target) % DAY);
            }

            timer.classList.toggle("countdown-red", target <= now);

            const totalSeconds = Math.floor(remaining / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            timer.textContent =
                `${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        });
    }

    updateArenaCountdowns();
    setInterval(updateArenaCountdowns, 1000);
 
})();
 
</script>
