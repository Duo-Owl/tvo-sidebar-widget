    <style>
        @font-face {
         font-family: 'Chess Sans';
         src: url('https://www.chess.com/bundles/web/fonts/chess-sans/chess-sans-800.9f4a2f62.woff2') format('woff2');
         font-weight: 700;
         font-style: normal;
        }

        :root {
         --gradient-blue: linear-gradient(135deg, #0a0f2c, #0d1b4b, #1a2f6f);
         --gradient-glass: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
         --gradient-glass-light: linear-gradient(to bottom, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05));
         --gradient-green: linear-gradient(180deg, #81B64C 0%, #5D9948 100%);
         --gradient-green-light: linear-gradient(180deg, color-mix(in srgb, #B2E068, transparent 50%) 0%, transparent 100%), linear-gradient(180deg, #81B64C 0%, #5D9948 100%);
         --gradient-red: linear-gradient(90deg, rgba(217, 74, 58, 0.25), rgba(255, 255, 255, 0.025) 75%);
         --gradient-green-left: linear-gradient(90deg, rgba(129, 182, 76, 0.25), rgba(255, 255, 255, 0.025) 75%);
         --gradient-gold: linear-gradient(90deg, rgba(221, 176, 64, 0.25), rgba(255, 255, 255, 0.025) 75%);

         --transparent-gold: #ddb04033;
         --transparent-green: #81b64c33;

        a {

        }

        }

        hr {

        html, body {
         background: var(--gradient-blue);
         background-color: transparent ;
         color-scheme: light dark;
         margin: 0;
        }
     
        body {
         font-family: var(--font-main);
         margin: 0;
         min-height: 100vh;
         height: auto;
         display: flex;
         overflow-x: hidden;
         overflow-y: auto;
         flex-direction: column;
         box-sizing: border-box;
         color: var(--text-white);
        }

        ::-webkit-scrollbar { 
         width: 6px;
        }
      
        ::-webkit-scrollbar-thumb {
         background: var(--gold);
         border-radius: 10px;
        }
      
        .regular-text {
         font-family: var(--font-second);
         font-size: 15px;
         color: var(--text-darker);
        }

/* -------------------- LAYOUT -------------------- */

        .main {
         justify-content: flex-start;
         align-items: center;
         display: flex;
         flex-direction: column;
         gap: 10px;
         width: 100%;
         flex: 1;
         background: transparent;
        }

/* -------------------- MAIN -------------------- */
     
        .large-box {
         padding: 20px;
         width: 100%;
         max-width: 750px;
         background: var(--shade);
         border: 1px solid var(--tint);
         border-radius: 8px;
         display: grid;
         grid-template-columns: repeat(2, minmax(0, 1fr));
         gap: 12px;
         box-sizing: border-box;

        }

        .large-box option {
         background: rgba(0, 0, 0, 0.2);
         color: #fff;
        }

        .header-text {
         font-family: var(--font-main);
         font-weight: 700;
         font-size: 24px;
         margin-bottom: 6px;
         display: flex;
         height: 24px;
         grid-column: span 2;
        }

        .small-box {
         background: var(--shade);
         border: 1px solid var(--tint);
         border-radius: 8px;
         padding: 10px;
         font-family: var(--font-second);
         font-size: 15px;
         color: var(--text-darker);
         display: flex;
         justify-content: space-between;
         align-items: center;
        }

/* -------------------- INPUT -------------------- */
     
        .input {
         background: var(--shade);
         border: 1px solid var(--tint);
         border-radius: 8px;
         padding: 10px;
         font-family: var(--font-second);
         font-size: 15px;
         display: flex;
         justify-content: space-between;
         align-items: center;
        }

        .input:focus {
         border: 1px solid var(--gold);
         outline: none;
        }

        #timeInput {
         color: var(--text-white);
         cursor: pointer;
        }

        #timeInput option {
         background-color: #0b132b;
         color: var(--text-darker);
         font-family: var(--font-second);
        }
     
        .button-enter {
         background: var(--gradient-green);
         font-family: var(--font-main);
         border-radius: 0.5rem;
         padding: 10px;
         align-items: center;
         justify-content: center;
         display: flex;
         cursor: pointer;
         color: var(--text-white);
         box-shadow: inset 0 .1rem 0 0 color-mix(in srgb, #B2E068, transparent 60%), inset 0 -.1rem 0 0 #45753C, inset 0 .2rem .4rem 0 color-mix(in srgb, #B2E068, transparent 50%), inset 0 -.2rem .4rem 0 color-mix(in srgb, #45753C, transparent 50%), 0 .1rem .2rem 0 rgba(0, 0, 0, .14), 0 .2rem .4rem 0 rgba(0, 0, 0, .1);
         margin-top: 10px;
         width: 100%;
         border: 0px solid;
         font-size: 15px;
         text-shadow: 0 .1rem 0 rgba(0, 0, 0, .2);
         grid-column: span 2;
        }

        .button-enter:hover {
         background: var(--gradient-green-light);
        }

/* -------------------- LIST -------------------- */

        .list {
         grid-column: span 2;
         font-family: var(--font-second);
         font-size: 15px;
         color: var(--white);
         background: var(--shade);
         border: 1px solid var(--tint);
         border-radius: 8px;
         padding: 25px;
         margin-top: 10px;
        }

        .updated {
         color: var(--text-darker);
        }

        .hr {
         font-size: 18px;
         font-weight: bold;
         text-decoration: underline;
        }

        .matches {
         
        }

        .priority {
         color: var(--red);
        }

        .match-heading-row {
         display: inline;
         font-weight: 400;
        }

        #leagueMatches > p,
        #friendlyMatches > p {
         margin: 0 0 14px;
         padding: 0;
        }

        #leagueMatches > p:last-child,
        #friendlyMatches > p:last-child {
         margin-bottom: 0;
        }

        .match-info-button {
         display: inline-flex;
         align-items: center;
         justify-content: center;
         width: 16px;
         height: 16px;
         padding: 0;
         margin: 0 0 0 3px;
         border: 0;
         border-radius: 50%;
         background: transparent;
         color: var(--gold);
         cursor: pointer;
         vertical-align: middle;
        }

        .match-info-button svg {
         display: block;
         width: 16px;
         height: 16px;
         fill: currentColor;
        }

        .match-info-button:hover,
        .match-info-button[aria-expanded="true"] {
         background: var(--transparent-gold);
        }

        .match-details[hidden] { display: none; }
        .match-details:not([hidden]) { display: block; }
        .match-link {
         overflow-wrap: anywhere;
        }
     
</style>

 <main class="main">

   <div class="large-box">

    <div class="list" style="display:none;">
     <div class="updated">Last updated --/--/--</div>
     <hr />
     <div class="hr">League Matches</div>
     <div id="leagueMatches"></div>
     <hr />
     <div class="hr">Friendly Matches</div>
     <div id="friendlyMatches"></div>

   </div>

 </main>


<script>

const leagueNames = [
  'PCL', '1WL', 'TVL', 'CW', 'Club Wars', 'ᄃﾚひ乃 Wﾑ尺丂',
  'KOTML', 'TMCL', 'TCMAC', 'LLCM', 'LaLEAGUE Chess Masters', 'WKCL'
];

const $ = (selector) => document.querySelector(selector);
const listEl = document.querySelector('.list');
const button = $('#buttonEnter');
const leagueContainer = $('#leagueMatches');
const friendlyContainer = $('#friendlyMatches');
const updatedEl = document.querySelector('.updated');

const API = 'https://api.chess.com/pub';
const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function slugFromInput(value) {
  return value.trim()
    .replace(/^https?:\/\/(www\.)?chess\.com\/club\//i, '')
    .replace(/^\/+|\/+$/g, '')
    .split(/[?#/]/)[0]
    .toLowerCase();
}

function apiUrlFromId(value) {
  if (!value) return '';
  if (value.startsWith('http')) return value;
  return `${API}/${value.replace(/^\/+/, '')}`;
}

async function fetchJson(url) {
  const response = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!response.ok) throw new Error(`Chess.com API returned ${response.status} for ${url}`);
  return response.json();
}

function cleanClubName(value) {
  if (!value) return 'opponent club';
  return String(value).replace(/\/+$/, '').split('/').pop().replace(/-/g, ' ');
}

function getTeamClubUrl(team) {
  return team?.['@id'] || team?.url || team?.club || '';
}

function teamMatchesSlug(team, slug) {
  const url = getTeamClubUrl(team).toLowerCase().replace(/\/+$/, '');
  return url.endsWith('/' + slug) || url.endsWith('/club/' + slug) || url.endsWith('/' + slug + '/');
}

function getPlayers(team) {
  return Array.isArray(team?.players) ? team.players : [];
}

function playerRating(player) {
  const rating = Number(player?.rating);
  return Number.isFinite(rating) && rating > 0 ? rating : null;
}

function averageElo(players) {
  const ratings = players.map(playerRating).filter(rating => rating !== null);
  return {
    average: ratings.length ? ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length : null,
    ratedCount: ratings.length,
    count: players.length,
    sum: ratings.reduce((sum, rating) => sum + rating, 0)
  };
}

function isLeagueMatch(name) {
  const normalized = String(name || '').toLowerCase();
  return leagueNames.some(league => normalized.includes(league.toLowerCase()));
}

function getMatchWebUrl(match, detail, matchId) {
  return match.url || detail.url || `https://www.chess.com/club/matches/${matchId}`;
}

function matchIdFromMatch(match) {
  const id = match['@id'] || match.url || '';
  const matchPath = id.match(/\/(?:pub\/)?match\/(?:live\/)?([^/?#]+)/i);
  if (matchPath) return matchPath[1];
  const webPath = id.match(/\/club\/matches\/([^/?#]+)/i);
  return webPath ? webPath[1] : '';
}

function eloRecruitmentRecommendation(homeElo, awayElo, margin, minimumPlayers = 0) {
  if (homeElo.average === null || awayElo.average === null || homeElo.ratedCount === 0) {
    return { count: 0, label: 'Elo range unavailable (player ratings missing)', target: null };
  }
  const target = awayElo.average + margin;
  
  const bands = [
    { label: '800-1000', rating: 800 },
    { label: '1000-1200', rating: 1000 },
    { label: '1200-1400', rating: 1200 },
    { label: '1400-1800+', rating: 1400 },
    { label: '1800+', rating: 1800 },
    { label: '2200+', rating: 2200 }
  ];
  for (const band of bands) {
    for (let count = Math.max(1, minimumPlayers); count <= 250; count++) {
      const projectedAverage = (homeElo.sum + count * band.rating) / (homeElo.ratedCount + count);
      if (projectedAverage > target) {
        return { count, label: `${count}x ${band.label} players`, target, assumedRating: band.rating, projectedAverage };
      }
    }
  }
  return { count: Math.max(1, minimumPlayers), label: `${Math.max(1, minimumPlayers)}x 2200+ players (estimate)`, target };
}


function getRatingRestriction(match, detail) {
    const settings = detail?.settings || match?.settings || {};

    const min = Number(settings.min_rating);
    const max = Number(settings.max_rating);

    const hasMin = Number.isFinite(min) && min > 0;
    const hasMax = Number.isFinite(max) && max > 0;

    if (hasMin && hasMax) {
        return `${min}-${max}`;
    }

    if (hasMax) {
        return `U${max}`;
    }

    if (hasMin) {
        return `${min}+`;
    }

    return '';
}


function renderMatch(item, type) {
  const { match, detail, matchId, opponentName, deficit, homePlayers, awayPlayers, homeElo, awayElo, eloDeficit, eloRecruitment, totalNeeded } = item;
  const priorityLimit = type === 'league' ? 15 : 25;
  const matchName = match.name || detail.name || 'Chess.com match';
  const restriction = getRatingRestriction(match, detail);
  const displayedNeed = deficit;
  const playerLabel = `${displayedNeed}×${restriction ? ` ${restriction}` : ''} players`; 
  const heading = type === 'league'
    ? `${playerLabel} needed in ${matchName}`
    : `${playerLabel} needed against ${opponentName}`;
  const p = document.createElement('p');
  if (displayedNeed > priorityLimit) p.classList.add('priority');
  p.style.margin = '0 0 14px';

  const headingRow = document.createElement('span');
  headingRow.className = 'match-heading-row';
  const title = document.createElement('span');
  title.textContent = heading + (displayedNeed > priorityLimit ? '' : '');
  title.style.fontWeight = '400';
  headingRow.appendChild(title);

  const infoButton = document.createElement('button');
  infoButton.type = 'button';
  infoButton.className = 'match-info-button';
  infoButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm-1-9h2v6h-2zm0-4h2v2h-2z"/></svg>';
  infoButton.setAttribute('aria-label', 'Show calculation details');
  infoButton.setAttribute('aria-expanded', 'false');
  infoButton.title = 'Show calculation details';
  headingRow.appendChild(infoButton);
  p.appendChild(headingRow);

  const info = document.createElement('span');
  info.className = 'match-details';
  info.hidden = true;
  info.style.cssText = 'margin-top:7px;line-height:1.55;color:rgba(255,255,255,.72);font-size:13px;padding:10px;border:1px solid var(--tint);border-radius:6px;background:rgba(0,0,0,.12);box-sizing:border-box;';
  const eloText = (elo) => elo.average === null
    ? `unavailable (${elo.ratedCount}/${elo.count} rated players)`
    : `${Math.round(elo.average)} average (${elo.ratedCount}/${elo.count} rated players)`;
  const targetRatio = item.league ? 1.15 : 1.05;
  const requiredPlayers = Math.ceil(awayPlayers.length * targetRatio);
  const advantage = item.league ? '15%' : '5%';
  info.textContent = `Calculation details: your club has ${homePlayers.length} players; the opponent has ${awayPlayers.length}. Player advantage: ceil(${awayPlayers.length} × ${targetRatio}) = ${requiredPlayers} players (${advantage} advantage); player deficit = ${deficit}. Average Elo (informational only) — your club: ${eloText(homeElo)}; opponent: ${eloText(awayElo)}. Matches are included and player needs are calculated using player count only.`;
  infoButton.addEventListener('click', () => {
    const opening = info.hidden;
    info.hidden = !opening;
    infoButton.setAttribute('aria-expanded', String(opening));
    infoButton.title = opening ? 'Hide calculation details' : 'Show calculation details';
    infoButton.setAttribute('aria-label', infoButton.title);
  });
  p.appendChild(info);

  const a = document.createElement('a');
  a.className = 'match-link';
  a.href = getMatchWebUrl(match, detail, matchId);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = a.href;
  p.appendChild(document.createElement('br'));
  p.appendChild(a);
  return p;
}

async function inspectMatch(match, slug) {
  const matchId = matchIdFromMatch(match);
  if (!matchId) return null;
  const detailUrl = match['@id']?.includes('/pub/match/')
    ? match['@id']
    : `${API}/match/${matchId}`;
  const detail = await fetchJson(detailUrl);
  const teams = detail.teams || {};
  const teamEntries = Object.entries(teams).filter(([, team]) => team && typeof team === 'object');
  let homeEntry = teamEntries.find(([, team]) => teamMatchesSlug(team, slug));
  if (!homeEntry) {
    homeEntry = teamEntries.find(([, team]) => getPlayers(team).length) || teamEntries[0];
  }
  if (!homeEntry) return null;
  const awayEntry = teamEntries.find(([key]) => key !== homeEntry[0]);
  if (!awayEntry) return null;

  const homePlayers = getPlayers(homeEntry[1]);
  const awayPlayers = getPlayers(awayEntry[1]);
  const homeElo = averageElo(homePlayers);
  const awayElo = averageElo(awayPlayers);

  const league = isLeagueMatch(match.name || detail.name);
  const targetRatio = league ? 1.15 : 1.05;
  const targetPlayers = Math.ceil(awayPlayers.length * targetRatio);
  const deficit = Math.max(0, targetPlayers - homePlayers.length);
  const eloDeficit = false;
  const eloRecruitment = { count: 0, label: 'Elo is informational only' };
  const totalNeeded = deficit;
  if (deficit <= 0) return null;

  const opponentUrl = getTeamClubUrl(awayEntry[1]) || match.opponent || '';
  let opponentName = awayEntry[1].name || cleanClubName(opponentUrl);
  if (!awayEntry[1].name && opponentUrl) {
    try {
      const club = await fetchJson(opponentUrl.startsWith('http') ? opponentUrl : apiUrlFromId(opponentUrl));
      opponentName = club.name || opponentName;
    } catch (_) {}
  }

  return { match, detail, matchId, opponentName, deficit, homePlayers, awayPlayers, homeElo, awayElo, league, eloDeficit, eloRecruitment, totalNeeded };
}

function getStartTime(match) {
  const n = Number(match.start_time);
  return Number.isFinite(n) && n > 0 ? n * 1000 : null;
}

function withinSelectedWindow(match, choice) {
  if (choice === 'all') return true;
  const start = getStartTime(match);
  if (!start) return false;
  const windows = { '1wk': 7, '2wk': 14, '3wk': 21, '1m': 31 };
  return start >= Date.now() && start <= Date.now() + windows[choice] * 86400000;
}

async function createList() {
  const slug = slugFromInput($('#slugInput').value);
  if (!slug) {
    alert('Please enter a Chess.com club slug.');
    return;
  }

  button.disabled = true;
  button.style.opacity = '.7';
  button.textContent = 'Searching matches...';
  listEl.style.display = 'block';
  leagueContainer.replaceChildren();
  friendlyContainer.replaceChildren();
  updatedEl.textContent = 'Loading upcoming matches from Chess.com…';

  try {
    const data = await fetchJson(`${API}/club/${encodeURIComponent(slug)}/matches`);
    const registered = Array.isArray(data.registered) ? data.registered : [];
    const matches = registered.filter(match => withinSelectedWindow(match, $('#timeInput').value));

    if (!matches.length) {
      updatedEl.textContent = `Last updated ${new Date().toLocaleDateString()}`;
      return;
    }

    const results = [];
    const errors = [];
    for (const match of matches) {
      try {
        const result = await inspectMatch(match, slug);
        if (result) results.push(result);
      } catch (error) {
        errors.push(`${match.name || match['@id'] || 'A match'}: ${error.message}`);
      }
      await wait(120);
    }

    const leagues = results.filter(item => item.league).sort((a, b) => b.totalNeeded - a.totalNeeded);
    const friendlies = results.filter(item => !item.league).sort((a, b) => b.totalNeeded - a.totalNeeded);

    leagues.forEach((item, index) => {
      const matchEl = renderMatch(item, 'league');
      leagueContainer.appendChild(matchEl);
    });
    friendlies.forEach((item, index) => {
      const matchEl = renderMatch(item, 'friendly');
      friendlyContainer.appendChild(matchEl);
    });

    if (!leagues.length) leagueContainer.textContent = 'No league matches currently have a player deficit.';
    if (!friendlies.length) friendlyContainer.textContent = 'No friendly matches currently have a player deficit.';

    updatedEl.textContent = `Last updated ${new Date().toLocaleDateString()}`;
    if (errors.length) {
      const note = document.createElement('p');
      note.style.cssText = 'color:rgba(255,255,255,.65);font-size:12px;';
      note.textContent = `${errors.length} match(es) could not be checked. This can happen when Chess.com does not expose registered-match player lists or ratings yet.`;
      listEl.appendChild(note);
      console.warn('Chess.com match lookup errors:', errors);
    }
  } catch (error) {
    updatedEl.textContent = `Could not load club matches: ${error.message}. Check the slug and try again.`;
  } finally {
    button.disabled = false;
    button.style.opacity = '';
    button.innerHTML = '<svg data-glyph="layout-list-numbered" aria-hidden="true" height="15" width="15" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="white" d="m2 14.97v-1.23l1.97-1.5c1-.77 1.4-1.07 1.4-1.47 0-.43-.43-.73-1.07-.73-.93 0-1.63.93-1.63.93l-.77-.67s.8-1.27 2.37-1.27c1.17 0 2.1.67 2.1 1.7 0 .8-.57 1.37-1.5 2.07l-1.53 1.17h3.23v1zm2-8.54v-4.47l-1.7 1.17-.47-.87 2.57-1.7h.6v5.87zm.37 17.24c-1.63 0-2.57-1.07-2.57-1.07l.67-.77s.83.83 1.93.83c.8 0 1.27-.4 1.27-.9 0-.53-.47-.77-1.47-.77h-.8v-1h.8c1 0 1.33-.27 1.33-.8s-.43-.83-1.17-.83c-1.2 0-1.9.83-1.9.83l-.67-.77s.83-1.07 2.47-1.07c1.33 0 2.27.7 2.27 1.73 0 1.17-1.23 1.8-2.33 1.8v-.77c1.1 0 2.47.63 2.47 1.83 0 1-.97 1.7-2.3 1.7zm16.2-1.67h-9.13c-1.03 0-1.43-.4-1.43-1.43v-.13c0-1.03.4-1.43 1.43-1.43h9.13c1.03 0 1.43-.4 1.43 1.43v.13c0 1.03-.4 1.43-1.43 1.43zm0-8.5h-9.13c-1.03 0-1.43-.4-1.43-1.43v-.13c0-1.03.4-1.43 1.43-1.43h9.13c1.03 0 1.43 1.43-1.43 1.43zm0-8.5h-9.13c-1.03 0-1.43-.4-1.43-1.43v-.13c0-1.03.4-1.43 1.43-1.43h9.13c1.03 0 1.43 1.43-1.43 1.43zm0 0"></path></svg>&nbsp;Create list';
  }
}

button.addEventListener('click', createList);
$('#slugInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') createList();
});

listEl.style.display = 'none';
leagueContainer.replaceChildren();
friendlyContainer.replaceChildren();
